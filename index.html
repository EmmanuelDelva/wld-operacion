<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WLD · operación</title>
<meta name="theme-color" content="#0B0E13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WLD">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" href="icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{--fondo:#0B0E13;--panel:#12161D;--alto:#181E27;--borde:#232B36;--linea:#1E2530;--texto:#EAEFF5;--mut:#98A4B3;--verde:#3FB68B;--rojo:#FF7B72;--ambar:#F4C15D;--azul:#7CC4FF;--gris:#8A96A4}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:Geist,system-ui,-apple-system,sans-serif;font-size:13px;line-height:1.35}
#app{max-width:1340px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.p{background:var(--panel);border:1px solid var(--borde);border-radius:12px;padding:12px;min-width:0}
.lab{font-size:11px;color:var(--mut);letter-spacing:.02em}
.mut{color:var(--mut)}
.num{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.h{font-size:13px;font-weight:600}
.verde{color:var(--verde)}.rojo{color:var(--rojo)}.ambar{color:var(--ambar)}.azul{color:var(--azul)}.gris{color:var(--gris)}
.fila{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--linea);font-size:12.5px}
.kv>span:first-child{color:var(--mut)}
.kv>span:last-child{text-align:right}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;background:var(--alto);border:1px solid var(--borde);font-size:11.5px;white-space:nowrap}
.btn{font:inherit;font-size:13px;font-weight:500;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--borde);background:var(--alto);color:var(--texto);cursor:pointer}
.btn:active{opacity:.7}
.pri{background:var(--texto);color:var(--fondo);border-color:var(--texto);font-weight:600}
.par{display:flex;border:1px solid var(--borde);border-radius:10px;overflow:hidden}
.par .btn{border:0;border-radius:0}
.par .btn[aria-pressed="true"]{background:var(--texto);color:var(--fondo);font-weight:600}
.tile{background:var(--alto);border-radius:10px;padding:7px 9px;min-width:0}
.seg{padding:8px 10px;border-radius:10px;background:var(--alto);min-width:0;flex:1 1 110px}
.seg.zona{background:#2A2412;border:1px solid #5A4718;flex:2 1 200px}
.seg.inv{background:#2A1616;border:1px solid #5A2A2A}
.estado{font-size:28px;font-weight:600;line-height:1.1;letter-spacing:-.02em}
.tf{display:grid;grid-template-columns:34px 62px minmax(0,1fr) 22px;align-items:center;gap:8px;padding:4px 0;border-top:1px solid var(--linea);font-size:12px}
.bar{height:5px;border-radius:99px;background:var(--linea);overflow:hidden}
.bar>i{display:block;height:100%}
.dos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.cuatro{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
details.sec{border-top:1px solid var(--linea)}
details.sec:first-child{border-top:0}
details.sec>summary{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .t{font-weight:600;white-space:nowrap}
details.sec>summary .f{margin-left:auto;color:var(--mut);font-size:12px;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.sec>summary::after{content:"›";color:var(--mut);font-size:18px;transition:transform .15s}
details.sec[open]>summary::after{transform:rotate(90deg)}
details.sec>.b{padding:0 0 10px}
.op{display:grid;grid-template-columns:42px minmax(0,1fr);gap:4px 8px;padding:8px 0;border-top:1px solid var(--linea)}
.op .m{font-weight:600}
.op .l1{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.op .l2{grid-column:2;font-size:11.5px;color:var(--mut)}
.sen{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:6px 0;border-top:1px solid var(--linea);font-size:12px}
.sen .r{font-weight:600;text-align:right}
textarea,input[type=text]{font:inherit;color:var(--texto);background:var(--fondo);border:1px solid var(--borde);border-radius:10px;padding:8px 10px}
input[type=text]{min-height:44px;width:104px;font-size:15px}
textarea{width:100%;min-height:96px;font-size:13px}
.carga{color:var(--mut);padding:40px 0;text-align:center}
.aviso{border-color:#5A2A2A;color:var(--rojo)}
.cols{display:flex;flex-direction:column;gap:10px}
@media (min-width:1100px){
  .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
  .ancho2{grid-column:span 2}
}
</style>
</head>
<body>
<div id="app"><p class="carga">Leyendo Binance desde este aparato…</p></div>
<script type="module" src="app.js"></script>
</body>
</html>
